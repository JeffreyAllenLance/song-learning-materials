<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guitar References</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f7fb; --panel:#ffffff; --ink:#20232e; --muted:#767c8f;
    --faint:#a7adbd; --line:#dde0ea; --accent:#6f6fb3; --accent-deep:#4a4a86; --warm:#c8788f;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding:48px 20px 64px;
  }
  .wrap{max-width:640px; margin:0 auto}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--accent-deep); font-weight:600;
  }
  h1{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:700;
    font-size:clamp(34px,8vw,54px); letter-spacing:-.02em; line-height:1; margin:.2em 0 .1em;
  }
  .lede{color:var(--muted); font-size:15px; margin:0 0 30px}
  .lede b{color:var(--ink); font-weight:600}
  a.card{
    display:block; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:22px 22px 20px; margin-bottom:16px; transition:border-color .15s, transform .15s;
  }
  a.card:hover{border-color:var(--accent); transform:translateY(-1px)}
  .card h2{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:26px;
    letter-spacing:-.015em; margin:0; display:flex; align-items:baseline; gap:10px;
  }
  .card h2 .go{margin-left:auto; font-size:15px; color:var(--accent); font-weight:600}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:var(--paper);
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; color:var(--ink);
  }
  .chip b{color:var(--accent-deep); font-weight:600}
  footer{margin-top:28px; color:var(--faint); font-size:12px; font-family:'IBM Plex Mono',monospace}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Guitar References</div>
  <h1>Foxblushing Demo Tracks</h1>
  <p class="lede">Chord charts, voicings, lead lines and tone notes. Tap a song to open its full reference.</p>

  <a class="card" href="the-plains-guitar-reference.html">
    <h2>The Plains <span class="go">open →</span></h2>
    <div class="chips">
      <span class="chip">Key <b>F#</b></span>
      <span class="chip"><b>75</b> BPM</span>
      <span class="chip">DADEAD · Capo 4</span>
    </div>
  </a>

  <a class="card" href="violets-guitar-reference.html">
    <h2>Violets <span class="go">open →</span></h2>
    <div class="chips">
      <span class="chip">Key <b>Db</b></span>
      <span class="chip"><b>138</b> BPM</span>
      <span class="chip">DADEAD · Capo 4</span>
    </div>
  </a>

</div>
</body>
</html>
